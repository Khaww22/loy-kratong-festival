<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ลอยกระทงออนไลน์ - ริมท่าน้ำ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{color-scheme:dark;--bg:#070b1f;--fg:#fff3d6;--acc:#ffb347;--card:#141a3a;--line:#3a3f6e}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:Sarabun,'Noto Sans Thai',system-ui,sans-serif;overflow:hidden;user-select:none}
canvas{display:block;width:100%;height:100%}
h1{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;margin:0;font-size:clamp(18px,3.8vw,26px);text-shadow:0 0 12px #ffb347;pointer-events:none}
#st{position:fixed;top:calc(44px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;font-size:12px;opacity:.85;pointer-events:none}
#hint{position:fixed;top:calc(66px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:rgba(20,26,58,.88);border:1px solid var(--acc);padding:4px 14px;border-radius:999px;font-size:13px;pointer-events:none;transition:.2s;white-space:nowrap}
#bar{position:fixed;left:0;right:0;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 10px;z-index:2}
button{font:inherit;cursor:pointer;border:1px solid var(--acc);background:rgba(20,26,58,.9);color:var(--fg);padding:9px 14px;border-radius:999px;font-weight:600;transition:.15s}
button.pri{background:linear-gradient(#ffb347,#ff8a2b);color:#2a1300;border:0}
button:disabled{opacity:.45;cursor:not-allowed;filter:grayscale(1)}
button:hover:not(:disabled){filter:brightness(1.15)}
#ov{position:fixed;inset:0;background:rgba(3,5,18,.78);display:none;align-items:center;justify-content:center;padding:12px;z-index:5}
#md{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;width:min(440px,100%);max-height:92vh;overflow:auto}
#md h2{margin:0 0 10px;font-size:20px}
label{display:block;margin:10px 0 4px;font-size:14px;font-weight:600}
input[type=text],textarea,select{width:100%;font:inherit;padding:9px;border-radius:10px;border:1px solid var(--line);background:#0b1030;color:var(--fg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.types button{padding:4px;border-radius:12px;font-size:12px;font-weight:400}
.types button.on{border-width:2px;background:#2b2f66}
.types canvas{width:100%;height:auto}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.opt{display:flex;gap:8px;align-items:center;margin:6px 0;cursor:pointer;font-weight:400}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;margin:6px 0}
.it small{display:block;opacity:.8}
.orig{padding:10px;border-radius:12px;background:#0b1030;border:1px dashed var(--acc)}
#toast{position:fixed;top:25%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);border:1px solid var(--acc);padding:10px 18px;border-radius:12px;display:none;z-index:9}
canvas{touch-action:none}*{-webkit-tap-highlight-color:transparent}
@media (max-width:640px),(max-height:480px){
h1{font-size:15px!important;top:calc(6px + env(safe-area-inset-top,0px))}
#st{display:none}
#hint{top:calc(30px + env(safe-area-inset-top,0px));font-size:11px;padding:3px 10px;white-space:normal;max-width:92vw;text-align:center;background:rgba(20,26,58,.7)}
#bar{flex-wrap:nowrap;gap:6px;bottom:calc(6px + env(safe-area-inset-bottom,0px))}
#bar button{padding:0;width:44px;height:44px;font-size:20px;display:flex;align-items:center;justify-content:center}
#bar button.pri{width:52px}.t{display:none}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<h1>🪷 ลอยกระทงออนไลน์ 🪷</h1>
<div id="st"></div>
<div id="hint">🚶 คลิกที่พื้นริมตลิ่ง หรือกดปุ่มลูกศร / WASD เพื่อเดินไปใกล้แม่น้ำ</div>

<div id="bar">
  <button id="bChar" title="แต่งตัวละคร">👘<span class="t"> แต่งตัวละคร</span></button>
  <button class="pri" id="bNew" disabled title="ลอยกระทง">🪔<span class="t"> ลอยกระทง (เดินไปริมน้ำก่อน)</span></button>
  <button id="bJoin" title="ขอลอยกับผู้อื่น">🤝<span class="t"> ขอลอยกับผู้อื่น</span></button>
  <button id="bDel" title="กระทงของฉัน">🗑️<span class="t"> กระทงของฉัน</span></button>
  <button id="bSnd" aria-label="เสียง">🔇<span class="t"> เสียง</span></button>
</div>

<div id="ov"><div id="md"></div></div>
<div id="toast"></div>

<script>
/* ============================================================================
   ตั้งค่าระบบออนไลน์ (Firebase Realtime Database)
   หากต้องการเปิดออนไลน์ให้คนอื่นเห็นตัวละครและกระทงพร้อมกัน:
   1. สร้าง Realtime Database ฟรีที่ https://console.firebase.google.com/
   2. ตั้งค่า Rules เป็น {"rules":{".read":true,".write":true}}
   3. นำ URL ฐานข้อมูลมาใส่ในตัวแปร FIREBASE_DB_URL ด้านล่าง
   ============================================================================ */
const FIREBASE_DB_URL = "https://loy-kratong-festival-b9e1d-default-rtdb.asia-southeast1.firebasedatabase.app/";

const F="Sarabun,'Noto Sans Thai',system-ui,sans-serif",$=s=>document.querySelector(s);
const TYPES=[['banana','ใบตอง'],['lotus','ดอกบัว'],['coconut','กะลามะพร้าว'],['bread','ขนมปัง']];
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const hash=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return h};

/* ---------- ข้อมูลตัวละครของผู้เล่น ---------- */
const MY_ID = 'u_' + Math.random().toString(36).slice(2, 9);
let myChar = JSON.parse(localStorage.getItem('my_thai_char') || 'null') || {
  id: MY_ID,
  name: 'ผู้มาเยือน',
  gender: 'female',      // 'female' | 'male'
  hairStyle: 'bun',      // 'bun' | 'ponytail' | 'braid'
  hairLen: 'midback',    // 'chest' | 'underbust' | 'midback' | 'waist'
  outfitColor: '#c2185b',
  x: 0.5,
  y: 0.88,
  dir: 1
};
myChar.id = MY_ID;
let targetPos = null;
let otherPlayers = {};

/* ---------- ระบบจัดเก็บข้อมูล (ไม่มีกระทงผีเริ่มต้น) ---------- */
let mine = new Set();
try { mine = new Set(JSON.parse(localStorage.getItem('krathong_mine') || '[]')); } catch(e) {}
const saveMine = () => { try { localStorage.setItem('krathong_mine', JSON.stringify([...mine])); } catch(e) {} };

let items = [], mode = 'local';
function setItems(a) {
  items = a.filter(k => k && k.id && k.name).sort((x, y) => x.created - y.created).slice(-35);
  const onlineCount = Object.keys(otherPlayers).length + 1;
  $('#st').textContent = (mode === 'online'
    ? `🟢 ออนไลน์เรียลไทม์ · ผู้ร่วมงาน ${onlineCount} คน`
    : `🟡 โหมดเล่นในเครื่อง (แสดงเฉพาะกระทงที่ลอยจริง)`) + ` · กระทงในน้ำ ${items.length} ใบ`;
}

// Local Storage (เริ่มต้นเป็นอาเรย์ว่าง ไม่มีข้อมูลจำลอง)
const K_STORE = 'krathong_real_v1';
const loadLocal = () => { try { return JSON.parse(localStorage.getItem(K_STORE)) || []; } catch(e) { return []; } };
const saveLocal = a => { try { localStorage.setItem(K_STORE, JSON.stringify(a)); } catch(e) {} };
let localData = loadLocal();
setItems(localData);
addEventListener('storage', () => { if (mode === 'local') { localData = loadLocal(); setItems(localData); } });

// เชื่อมต่อ Firebase REST Polling (ถ้าใส่ FIREBASE_DB_URL)
if (FIREBASE_DB_URL) {
  mode = 'online';
  const base = FIREBASE_DB_URL.replace(/\/$/, '');
  const syncOnline = async () => {
    try {
      await fetch(`${base}/players/${MY_ID}.json`, {
        method: 'PUT',
        body: JSON.stringify({...myChar, updated: Date.now()})
      });
      const [rk, rp] = await Promise.all([
        fetch(`${base}/krathongs.json`).then(r => r.json()),
        fetch(`${base}/players.json`).then(r => r.json())
      ]);
      const now = Date.now();
      otherPlayers = {};
      if (rp) {
        Object.values(rp).forEach(p => {
          if (p && p.id !== MY_ID && now - (p.updated || 0) < 15000) otherPlayers[p.id] = p;
        });
      }
      setItems(mergePending(rk ? Object.values(rk) : []));
    } catch (e) {}
  };
  syncOnline();
  setInterval(syncOnline, 1500);
}

const pending = {};
function mergePending(a) {
  const ids = new Set(a.map(x => x && x.id)), now = Date.now();
  for (const id in pending) {
    const p = pending[id];
    if (ids.has(id) || (!p.failed && now - p.t > 30000)) delete pending[id]; else a.push(p.k);
  }
  return a;
}
const store = {
  async add(k) {
    if (mode === 'online') {
      const base = FIREBASE_DB_URL.replace(/\/$/, '');
      pending[k.id] = { k, t: Date.now(), failed: false };
      setItems(mergePending([...items]));
      try {
        const r = await fetch(`${base}/krathongs/${k.id}.json`, { method: 'PUT', body: JSON.stringify(k) });
        if (!r.ok) throw new Error(r.status);
      } catch (e) { pending[k.id].failed = true; toast('บันทึกขึ้นฐานข้อมูลออนไลน์ไม่สำเร็จ (เช็ก Rules ของ Firebase) กระทงจะเห็นเฉพาะในเครื่องนี้'); }
    } else {
      localData = loadLocal();
      localData.push(k);
      saveLocal(localData);
      setItems(localData);
    }
  },
  async del(id) {
    if (mode === 'online') {
      const base = FIREBASE_DB_URL.replace(/\/$/, '');
      delete pending[id];
      await fetch(`${base}/krathongs/${id}.json`, { method: 'DELETE' });
      items = items.filter(x => x.id !== id);
    } else {
      localData = loadLocal().filter(x => x.id !== id);
      saveLocal(localData);
      setItems(localData);
    }
  },
  async join(id, n, w) {
    if (mode === 'online') {
      const base = FIREBASE_DB_URL.replace(/\/$/, '');
      const cur = await fetch(`${base}/krathongs/${id}.json`).then(r => r.json());
      if (!cur || !cur.open) return false;
      await fetch(`${base}/krathongs/${id}.json`, {
        method: 'PATCH',
        body: JSON.stringify({ open: false, name2: n, wish2: w })
      });
      return true;
    } else {
      localData = loadLocal();
      const k = localData.find(x => x.id === id);
      if (!k || !k.open) return false;
      Object.assign(k, { open: false, name2: n, wish2: w });
      saveLocal(localData);
      setItems(localData);
      return true;
    }
  }
};

/* ---------- วาดตัวละครชุดไทย ---------- */
const mixc=(h,t,a)=>{const p=q=>[1,3,5].map(i=>parseInt(q.slice(i,i+2),16)),A=p(h),B=p(t);return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*a)).join(',')+')'};
const HAIRS=[['bun','มวยผมปิ่นทอง'],['lowbun','มวยต่ำทัดมาลัยมะลิ'],['loose','ผมยาวสยายทัดดอกไม้'],['twinbraid','เปียคู่ผูกโบว์'],['bob','ผมบ็อบประดับดอกไม้'],['chada','ชฎาทองพร้อมผมเกล้า'],['ponytail','หางม้า'],['braid','ถักเปียข้าง']];
function flower(c,x,y,col,r){c.fillStyle=col;for(let i=0;i<5;i++){const a=i/5*6.28;c.beginPath();c.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,r*.75,0,7);c.fill()}c.fillStyle='#ffd54f';c.beginPath();c.arc(x,y,r*.6,0,7);c.fill()}
function jasmine(c,x,y,r){c.fillStyle='#fffdf5';for(let i=0;i<8;i++){const a=i/8*6.28;c.beginPath();c.arc(x+Math.cos(a)*r,y+Math.sin(a)*r,1.5,0,7);c.fill()}}
function hairBack(c,st,t,side){const w=Math.sin(t*2)*1.2;c.fillStyle='#1c1614';
 if(st==='loose'){c.beginPath();c.moveTo(-10,-52);c.quadraticCurveTo(-16,-38,-13+w,-19);c.quadraticCurveTo(0,-14,13+w,-19);c.quadraticCurveTo(16,-38,10,-52);c.closePath();c.fill();c.strokeStyle='rgba(255,255,255,.1)';c.lineWidth=1;[-6,0,6].forEach(o=>{c.beginPath();c.moveTo(o,-46);c.quadraticCurveTo(o*1.6,-34,o*1.4+w,-20);c.stroke()})}
 else if(st==='bob'){c.beginPath();c.roundRect(-11.5,-59,23,20,9);c.fill()}
 else if(st==='lowbun'){c.beginPath();c.ellipse(side*8,-42,7,6,0,0,7);c.fill()}
 else if(st==='ponytail'){c.strokeStyle='#1c1614';c.lineWidth=5.5;c.lineCap='round';c.beginPath();c.moveTo(side*7,-52);c.quadraticCurveTo(side*15,-44,side*12+w,-24);c.stroke()}
}
function hairFront(c,st,t,side){const w=Math.sin(t*3);c.fillStyle='#1c1614';
 c.beginPath();c.moveTo(-9.5,-50);c.quadraticCurveTo(-4,-56,-side*2,-52);c.lineTo(0,-50);c.fill();
 if(st==='bun'){c.beginPath();c.arc(0,-61,6.5,0,7);c.fill();jasmine(c,0,-61,7.4);c.strokeStyle='#ffd54f';c.lineWidth=1.8;c.beginPath();c.moveTo(-8,-64);c.lineTo(8,-58);c.stroke();c.fillStyle='#ffd54f';c.beginPath();c.arc(8,-58,1.8,0,7);c.fill()}
 else if(st==='lowbun'){jasmine(c,side*8,-42,7.6);c.strokeStyle='#ffd54f';c.lineWidth=1.6;c.beginPath();c.moveTo(side*4,-47);c.lineTo(side*12,-38);c.stroke();flower(c,-side*7,-53,'#ff80ab',1.8)}
 else if(st==='loose'){[-1,1].forEach(s=>{c.fillStyle='#1c1614';c.beginPath();c.ellipse(s*10,-40,2.6,8,s*.1,0,7);c.fill()});flower(c,-side*6,-53,'#ff80ab',1.9);flower(c,-side*9,-50,'#ffffff',1.3)}
 else if(st==='twinbraid'){[-1,1].forEach(s=>{for(let i=0;i<6;i++){c.fillStyle='#1c1614';c.beginPath();c.ellipse(s*(10.5+Math.sin(t*3+i)*.4*(i/6)),-45+i*3.6,2.5,2.2,0,0,7);c.fill()}c.fillStyle='#e53935';c.beginPath();c.arc(s*10.8,-23,2,0,7);c.arc(s*10.8-2.4,-22,1.4,0,7);c.arc(s*10.8+2.4,-22,1.4,0,7);c.fill()})}
 else if(st==='bob'){flower(c,-side*7,-54,'#ff80ab',2);flower(c,-side*10,-51,'#fffdf5',1.3);c.strokeStyle='rgba(255,255,255,.12)';c.lineWidth=1;c.beginPath();c.moveTo(-8,-52);c.quadraticCurveTo(0,-57,8,-52);c.stroke()}
 else if(st==='chada'){c.fillStyle='#ffc107';c.beginPath();c.moveTo(-9,-55);c.lineTo(-7,-64);c.lineTo(-3.5,-60);c.lineTo(0,-73);c.lineTo(3.5,-60);c.lineTo(7,-64);c.lineTo(9,-55);c.closePath();c.fill();c.strokeStyle='#ff8f00';c.lineWidth=.8;c.stroke();c.fillStyle='#e53935';c.beginPath();c.arc(0,-60,1.5,0,7);c.fill();c.fillStyle='#43a047';c.beginPath();c.arc(-4.5,-58,1.1,0,7);c.arc(4.5,-58,1.1,0,7);c.fill();c.fillStyle='#ffc107';[-1,1].forEach(s=>{c.beginPath();c.moveTo(s*9,-54);c.lineTo(s*14,-60);c.lineTo(s*11.5,-49);c.closePath();c.fill()})}
 else if(st==='ponytail'){c.fillStyle='#ffd54f';c.beginPath();c.arc(side*8,-51,2.2,0,7);c.fill();flower(c,-side*6,-53,'#ff80ab',1.6)}
 else{const st2=5;for(let i=0;i<=st2;i++){const py=-48+(25*i/st2)*-1*-1,px=side*9+(i%2?1.5:-1.5)+w*(i/st2);c.fillStyle='#1c1614';c.beginPath();c.arc(px,-48+i*5,2.8,0,7);c.fill()}c.fillStyle='#ff7043';c.beginPath();c.arc(side*9+w,-22,2.2,0,7);c.fill()}
}
function drawCharacter(c,p,x,y,t,isWalking){
 c.save();c.translate(x,y);c.scale(1.15,1.15);
 const ph=t*8,bob=isWalking?Math.abs(Math.sin(ph))*2.5:Math.sin(t*2)*.8,sw=isWalking?Math.sin(ph):0,dir=p.dir||1,fem=p.gender==='female';
 c.fillStyle='rgba(0,0,0,.38)';c.beginPath();c.ellipse(0,0,14,4.5,0,0,7);c.fill();c.translate(0,-bob);
 const oc=p.outfitColor||(fem?'#c2185b':'#1565c0'),skin=fem?'#f6cba5':'#e8b890',endY=({chest:-33,underbust:-28,midback:-23,waist:-17})[p.hairLen]||-23,side=-dir,look=dir*1.6;
 c.lineCap='round';c.lineJoin='round';
 const arm=(s,col,w)=>{const ex=s*12+(-s)*sw*3,ey=-21;c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.moveTo(s*8.5,-36);c.quadraticCurveTo(s*12,-29,ex,ey);c.stroke();c.fillStyle=skin;c.beginPath();c.arc(ex,ey+1,2,0,7);c.fill();c.fillStyle='#ffd54f';c.beginPath();c.arc(ex*.96,ey-2,1.5,0,7);c.fill()};
 c.fillStyle=skin;c.fillRect(-2,-42,4,5);
 if(fem)hairBack(c,p.hairStyle||'bun',t,side);
 if(fem){
  c.fillStyle='#ffd54f';[-1,1].forEach(s=>{c.beginPath();c.ellipse(s*4+s*sw*2.2,-1.5,3.2,1.8,0,0,7);c.fill()});
  const sk=c.createLinearGradient(0,-21,0,-3);sk.addColorStop(0,mixc(oc,'#ffffff',.25));sk.addColorStop(1,mixc(oc,'#000000',.35));
  const o=sw*.8;c.fillStyle=sk;c.beginPath();c.moveTo(-9,-21);c.lineTo(9,-21);c.lineTo(12.5+o,-3.5);c.lineTo(-12.5+o,-3.5);c.closePath();c.fill();
  c.fillStyle='#ffd54f';c.beginPath();c.moveTo(-11.7+o,-8);c.lineTo(11.7+o,-8);c.lineTo(12.5+o,-3.5);c.lineTo(-12.5+o,-3.5);c.closePath();c.fill();
  c.fillStyle=oc;for(let i=-3;i<=3;i++){c.beginPath();c.moveTo(i*3.4+o,-7.4);c.lineTo(i*3.4+1.3+o,-5.8);c.lineTo(i*3.4+o,-4.2);c.lineTo(i*3.4-1.3+o,-5.8);c.closePath();c.fill()}
  c.strokeStyle='rgba(255,224,130,.65)';c.lineWidth=.8;for(let i=-1;i<=1;i++){c.beginPath();c.moveTo(i*2.2,-20);c.lineTo(i*3+o*.6,-8.5);c.stroke()}
  c.fillStyle=mixc(oc,'#ffffff',.3);c.beginPath();c.moveTo(-9,-37);c.lineTo(-13,-23);c.lineTo(-8,-23);c.closePath();c.fill();
  c.fillStyle='#fff0c9';c.beginPath();c.roundRect(-8,-38,16,18,3);c.fill();
  c.fillStyle='#ffd54f';c.fillRect(-9,-22,18,2.6);
  c.fillStyle='#ffe9a8';c.strokeStyle=oc;c.lineWidth=1.2;c.beginPath();c.moveTo(-9,-39);c.lineTo(-2,-39);c.lineTo(10,-19);c.lineTo(3,-19);c.closePath();c.fill();c.stroke();
  c.fillStyle='#ffb300';for(let i=0;i<4;i++){c.beginPath();c.arc(-5+i*3.6,-35+i*4.6,.9,0,7);c.fill()}
  arm(-1,skin,3.2);arm(1,skin,3.2);
  c.strokeStyle='#ffd54f';c.lineWidth=1;c.beginPath();c.arc(0,-39,4.2,.2,Math.PI-.2);c.stroke();

    // เงาสะท้อนแสงเทียนและกระทงบนผิวน้ำ
    c.save();c.translate(x,y);c.rotate(Math.sin(t+h)*.03);
    const rg=c.createRadialGradient(0,2,0,0,2,45);rg.addColorStop(0,'rgba(255,180,70,.32)');rg.addColorStop(1,'rgba(255,150,40,0)');
    c.fillStyle=rg;c.fillRect(-45,-43,90,90);c.scale(1,-.22);c.globalAlpha=.22;drawK(c,k.type,t);c.restore();

    // ตัวกระทง
    c.save();c.translate(x,y);c.rotate(Math.sin(t+h)*.03);drawK(c,k.type,t);c.restore();

    if(k.open){c.fillStyle='#ffb347';c.beginPath();c.arc(x+26,y-26,8+Math.sin(t*4)*1,0,7);c.fill();c.fillStyle='#2a1300';c.font='700 13px '+F;c.textAlign='center';c.fillText('+',x+26,y-22)}
    const L=lines(c,k),n=L.n.length+L.w.length,bh=n*13+7,bw=L.mw+12,bx=x-bw/2,by=y+12;
    c.fillStyle='rgba(6,12,36,.8)';c.strokeStyle=k.open?'#ffb347':'rgba(255,255,255,.25)';c.lineWidth=1;c.beginPath();c.roundRect(bx,by,bw,bh,7);c.fill();c.stroke();
    c.textAlign='center';let ty=by+14;c.font='600 12px '+F;c.fillStyle='#ffd98a';L.n.forEach(s=>{c.fillText(s,x,ty);ty+=13});c.font='11px '+F;c.fillStyle='#fff';L.w.forEach(s=>{c.fillText(s,x,ty);ty+=13});
    hits.push({id:k.id,x0:Math.min(x-28,bx),y0:y-32,x1:Math.max(x+30,bx+bw),y1:by+bh});
  });

  shore(c,riverH,W,H,t);

  // 5. วาดตัวละครทั้งหมด (เรียงตามความลึกแกน Y)
  const allChars = [
    ...Object.values(otherPlayers).map(p => ({...p, walking: false})),
    {...myChar, walking: isWalking}
  ].sort((a, b) => a.y - b.y);

  allChars.forEach(p => {
    drawCharacter(c, p, p.x * W, p.y * H, t, p.walking);
  });

  // 6. พลุ
  if((nextFw-=.016)<0){burst(W*(.15+Math.random()*.7),H*(.06+Math.random()*.18));nextFw=4+Math.random()*4}
  c.globalCompositeOperation='lighter';fw=fw.filter(p=>p.l>0);fw.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.03;p.vx*=.985;p.l-=.011;c.fillStyle=p.col;c.globalAlpha=Math.max(p.l,0);c.beginPath();c.arc(p.x,p.y,2,0,7);c.fill()});c.globalAlpha=1;c.globalCompositeOperation='source-over';

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------- UI & Modals ---------- */
const ov=$('#ov'),md=$('#md');
function toast(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2400)}
function show(h){md.innerHTML=h;ov.style.display='flex'}function close(){ov.style.display='none'}
ov.addEventListener('mousedown',e=>{if(e.target===ov)close()});

// หน้าต่างแต่งตัวละครชุดไทย
function charModal() {
  show(`
    <h2>👘 แต่งตัวละครชุดไทย</h2>
    <div style="text-align:center;background:#0b1030;border-radius:12px;padding:10px;margin-bottom:8px">
      <canvas id="prevChar" width="140" height="135"></canvas>
    </div>
    <label>ชื่อตัวละคร</label>
    <input type="text" id="cn" maxlength="15" value="${esc(myChar.name)}">
    <div class="grid2">
      <div>
        <label>เพศ / ชุดไทย</label>
        <select id="cg">
          <option value="female" ${myChar.gender==='female'?'selected':''}>ผู้หญิง (สไบ + ผ้าถุง)</option>
          <option value="male" ${myChar.gender==='male'?'selected':''}>ผู้ชาย (ราชปะแตน + โจงกระเบน)</option>
        </select>
      </div>
      <div>
        <label>สีผ้าถุง / โจงกระเบน</label>
        <select id="ccol">
          <option value="#c2185b" ${myChar.outfitColor==='#c2185b'?'selected':''}>ชมพูบานเย็น</option>
          <option value="#1565c0" ${myChar.outfitColor==='#1565c0'?'selected':''}>น้ำเงินกรมท่า</option>
          <option value="#2e7d32" ${myChar.outfitColor==='#2e7d32'?'selected':''}>เขียวมรกต</option>
          <option value="#6a1b9a" ${myChar.outfitColor==='#6a1b9a'?'selected':''}>ม่วงเม็ดมะปราง</option>
          <option value="#b71c1c" ${myChar.outfitColor==='#b71c1c'?'selected':''}>แดงชาด</option>
        </select>
      </div>
    </div>
    <div id="femOpts" style="display:${myChar.gender==='female'?'block':'none'}">
      <label>ทรงผมผู้หญิง</label>
      <select id="chs">${HAIRS.map(([v,n])=>`<option value="${v}" ${myChar.hairStyle===v?'selected':''}>${n}</option>`).join('')}</select>
    </div>
    <div class="row">
      <button id="x">ยกเลิก</button>
      <button class="pri" id="ok">บันทึกตัวละคร</button>
    </div>
  `);

  const pCv = $('#prevChar').getContext('2d');
  const renderPrev = () => {
    pCv.clearRect(0,0,140,135);
    const temp = {
      name: $('#cn').value.trim() || 'ชื่อ',
      gender: $('#cg').value,
      hairStyle: $('#chs').value,
      outfitColor: $('#ccol').value,
      dir: 1
    };
    $('#femOpts').style.display = temp.gender === 'female' ? 'block' : 'none';
    drawCharacter(pCv, temp, 70, 122, 0, false);
  };
  ['#cn','#cg','#chs','#ccol'].forEach(id => $(id).oninput = renderPrev);
  renderPrev();

  $('#x').onclick = close;
  $('#ok').onclick = () => {
    const n = $('#cn').value.trim();
    if (!n) return toast('กรอกชื่อตัวละครก่อนนะ');
    myChar.name = n;
    myChar.gender = $('#cg').value;
    myChar.hairStyle = $('#chs').value;
    myChar.outfitColor = $('#ccol').value;
    localStorage.setItem('my_thai_char', JSON.stringify(myChar));
    close();
    toast('อัปเดตชุดไทยเรียบร้อย ✨');
  };
}

// หน้าต่างสร้างกระทง
function newModal(){
  if (myChar.y > 0.78) return toast('ต้องเดินไปใกล้ๆ ขอบแม่น้ำก่อนถึงจะลอยกระทงได้นะ');
  let ty='banana';
  show('<h2>🪔 สร้างกระทงใหม่</h2><div class="types">'+TYPES.map(([k,n])=>'<button data-t="'+k+'"'+(k===ty?' class="on"':'')+'><canvas width="120" height="90" data-k="'+k+'"></canvas>'+n+'</button>').join('')+'</div><label>ชื่อบนกระทง (ไม่เกิน 15 ตัวอักษร)</label><input type="text" id="fn" maxlength="15" value="'+esc(myChar.name)+'"><label>คำอวยพร / คำอธิษฐาน <span id="cc">0/60</span></label><textarea id="fw" rows="3" maxlength="60"></textarea><label class="opt"><input type="radio" name="m" value="1" checked> เปิดให้คนอื่นมาขอลอยด้วย</label><label class="opt"><input type="radio" name="m" value="0"> ลอยเดี่ยวเท่านั้น</label><div class="row"><button id="x">ยกเลิก</button><button class="pri" id="ok">ปล่อยกระทงลงน้ำ</button></div>');
  md.querySelectorAll('canvas').forEach(e=>{const x=e.getContext('2d');x.translate(60,62);x.scale(1.5,1.5);drawK(x,e.dataset.k,0)});
  md.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ty=b.dataset.t;md.querySelectorAll('[data-t]').forEach(z=>z.classList.toggle('on',z===b))});
  $('#fw').oninput=e=>$('#cc').textContent=e.target.value.length+'/60';$('#x').onclick=close;
  $('#ok').onclick=async()=>{const n=$('#fn').value.trim(),w=$('#fw').value.trim();if(!n||!w)return toast('กรอกชื่อและคำอวยพรก่อนนะ');
    const k={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),type:ty,name:n,wish:w,open:md.querySelector('[name=m]:checked').value==='1',created:Date.now(),startX:myChar.x,name2:'',wish2:''};
    await store.add(k);mine.add(k.id);saveMine();close();burst(myChar.x*W,H*.22);toast('ปล่อยกระทงลงแม่น้ำแล้ว 🪷')};
}

function joinForm(id){
  const k=items.find(x=>x.id===id);if(!k||!k.open)return toast('กระทงใบนี้ไม่เปิดรับแล้ว');
  show('<h2>🤝 ขอลอยด้วยกัน</h2><div class="orig"><b>'+esc(k.name)+'</b><br>'+esc(k.wish)+'</div><label>ชื่อของคุณ (ไม่เกิน 15 ตัวอักษร)</label><input type="text" id="jn" maxlength="15" value="'+esc(myChar.name)+'"><label>คำอวยพรเพิ่มเติม <span id="cc">0/60</span></label><textarea id="jw" rows="3" maxlength="60"></textarea><div class="row"><button id="x">ยกเลิก</button><button class="pri" id="ok">ยืนยัน</button></div>');
  $('#jw').oninput=e=>$('#cc').textContent=e.target.value.length+'/60';$('#x').onclick=close;
  $('#ok').onclick=async()=>{const n=$('#jn').value.trim(),w=$('#jw').value.trim();if(!n||!w)return toast('กรอกชื่อและคำอวยพรก่อนนะ');if(await store.join(id,n,w)){close();burst(W/2,H*.2);toast('ลอยคู่สำเร็จ ✨')}else{close();toast('มีคนตัดหน้าไปแล้ว')}};
}

function joinList(){
  const o=items.filter(k=>k.open);
  show('<h2>🤝 กระทงที่เปิดรับคนลอยด้วย</h2>'+(o.length?o.map(k=>'<div class="it"><div><b>'+esc(k.name)+'</b><small>'+esc(k.wish)+'</small></div><button data-j="'+k.id+'">ลอยด้วย</button></div>').join(''):'<p>ตอนนี้ยังไม่มีกระทงที่เปิดรับ ลองเดินไปริมน้ำแล้วสร้างใบใหม่ก่อนนะ</p>')+'<div class="row"><button id="x">ปิด</button></div>');
  $('#x').onclick=close;md.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>joinForm(b.dataset.j));
}

// จัดการและลบกระทงของฉัน (นำกลับมาจากไฟล์หลัก)
async function delK(id){await store.del(id);mine.delete(id);saveMine();close();toast('ลบกระทงแล้ว')}
function mineModal(id){const k=items.find(x=>x.id===id);if(!k)return;show('<h2>🪷 กระทงของคุณ</h2><div class="orig"><b>'+esc(k.name+(k.name2?' & '+k.name2:''))+'</b><br>'+esc(k.wish)+(k.wish2?'<br>'+esc(k.wish2):'')+'</div><div class="row"><button id="x">ปิด</button><button class="pri" id="dl">🗑️ ลบกระทงนี้</button></div>');$('#x').onclick=close;$('#dl').onclick=()=>delK(id)}
function mineList(){const o=items.filter(k=>mine.has(k.id));show('<h2>🗑️ กระทงของฉัน</h2>'+(o.length?o.map(k=>'<div class="it"><div><b>'+esc(k.name)+'</b><small>'+esc(k.wish)+'</small></div><button data-d="'+k.id+'">ลบ</button></div>').join(''):'<p>ยังไม่มีกระทงที่คุณลอยจากเครื่องนี้</p>')+'<div class="row"><button id="x">ปิด</button></div>');$('#x').onclick=close;md.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{await store.del(b.dataset.d);mine.delete(b.dataset.d);saveMine();mineList()})}

$('#bChar').onclick = charModal;
$('#bNew').onclick = newModal;
$('#bJoin').onclick = joinList;
$('#bDel').onclick = mineList;

// คลิกบน Canvas: คลิกกระทง -> จัดการ/ขอลอยด้วย | คลิกพื้นตลิ่ง -> เดินไปตรงนั้น
let drag=false;
function tapAt(e,first){const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(first)for(let i=hits.length-1;i>=0;i--){const h=hits[i];if(x>=h.x0&&x<=h.x1&&y>=h.y0&&y<=h.y1){const k=items.find(z=>z.id===h.id);if(k){if(mine.has(k.id))mineModal(k.id);else if(k.open)joinForm(k.id);else toast('กระทงใบนี้ลอยเดี่ยวหรือลอยคู่แล้ว')}return true}}
  targetPos={x:Math.max(.05,Math.min(.95,x/W)),y:Math.max(.72,Math.min(bankBot(),y/H))};return false}
cv.addEventListener('pointerdown',e=>{drag=!tapAt(e,true)});
cv.addEventListener('pointermove',e=>{if(drag&&e.buttons)tapAt(e,false)});
addEventListener('pointerup',()=>{drag=false});

/* ---------- เสียงบรรยากาศ ---------- */
let ac,gain,pl,on=false;
function snd(){on=!on;$('#bSnd').innerHTML=on?'🔊<span class="t"> เสียง</span>':'🔇<span class="t"> เสียง</span>';try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();const b=ac.createBuffer(1,ac.sampleRate*2,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;const s=ac.createBufferSource();s.buffer=b;s.loop=true;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=420;gain=ac.createGain();gain.gain.value=0;s.connect(f).connect(gain).connect(ac.destination);s.start()}
 ac.resume();gain.gain.value=on?.07:0;clearInterval(pl);if(on)pl=setInterval(()=>{const n=[392,440,523,587,659][Math.random()*5|0],o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.value=n;g.gain.setValueAtTime(.0001,ac.currentTime);g.gain.exponentialRampToValueAtTime(.05,ac.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+1.6);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+1.7)},2200)}catch(e){}}
$('#bSnd').onclick=snd;
</script>
